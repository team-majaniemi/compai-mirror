      async def compai_hack(spawner):
          username = spawner.user.name

          if username == "lamkoi" or username == "jkchau" or username == "mfhuma" or 'compai-scratch' in set(grp.name for grp in spawner.user.groups):

              spawner.volumes["compai-scratch"] = {
                      "name": "compai-scratch",
                      "persistentVolumeClaim": {"claimName": "compai-scratch"}
                  }

              spawner.volume_mounts["compai-scratch"] = {
                      "mountPath": "/home/jovyan/scratch",
                      "name": "compai-scratch"
                  }
              
              spawner.volumes["dshm"] = {
                      "name": "dshm",
                      "emptyDir": {"medium": "Memory","sizeLimit":"300Gi"}
                  }

              spawner.volume_mounts["dshm"] = {
                      "mountPath": "/dev/shm",
                      "name": "dshm"
                  }
              
              
      c.KubeSpawner.pre_spawn_hook = compai_hack
    lamkoitest.py: >
